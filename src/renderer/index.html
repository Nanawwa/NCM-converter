<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' blob: data:">
  <title>NCM 转换器</title>
  <style>
    :root {
      --bg: #16171a;
      --surface: #1d1f23;
      --surface-2: #24262b;
      --surface-3: #2c2f35;
      --border: #2b2e33;
      --border-strong: #3a3e46;
      --text: #e8e6e2;
      --text-2: #9ea3ab;
      --text-3: #6b7078;
      --accent: #e5484d;
      --accent-hover: #ef5f64;
      --accent-soft: rgba(229, 72, 77, 0.14);
      --green: #3fbf7f;
      --green-soft: rgba(63, 191, 127, 0.13);
      --red: #f2555a;
      --red-soft: rgba(242, 85, 90, 0.13);
      --amber: #d9a13b;
      --radius: 8px;
      --radius-sm: 5px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--text-2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* ============ 标题栏 ============ */
    .titlebar {
      height: 38px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
    }

    .titlebar-brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      color: var(--text);
      letter-spacing: 0.2px;
    }

    .titlebar-brand svg { color: var(--accent); }

    .titlebar-controls { display: flex; -webkit-app-region: no-drag; }

    .win-btn {
      width: 42px;
      height: 38px;
      border: none;
      background: transparent;
      color: var(--text-3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .win-btn:hover { background: var(--surface-3); color: var(--text); }
    .win-btn.close:hover { background: #c42b1c; color: #fff; }

    /* ============ 工具栏 ============ */
    .toolbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 10px 14px;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 12px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      color: var(--text);
      font-size: 12.5px;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.12s, border-color 0.12s;
    }
    .btn:hover { background: var(--surface-3); border-color: #484d55; }
    .btn:active { transform: translateY(0.5px); }
    .btn:disabled { opacity: 0.45; cursor: default; transform: none; }
    .btn svg { color: var(--text-3); }
    .btn:hover svg { color: var(--text-2); }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 500;
    }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-primary:hover svg { color: #fff; }
    .btn-primary svg { color: #fff; }
    .btn-primary:disabled { background: var(--surface-3); border-color: var(--border-strong); color: var(--text-3); }
    .btn-primary:disabled svg { color: var(--text-3); }

    .toolbar .spacer { flex: 1; }

    .toolbar .field {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .toolbar .field > label {
      font-size: 12px;
      color: var(--text-3);
      white-space: nowrap;
    }
    .toolbar input[type="text"] {
      width: 190px;
      height: 30px;
      padding: 0 9px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      color: var(--text-2);
      font-size: 12.5px;
      font-family: inherit;
      outline: none;
    }
    .toolbar input[type="text"]:focus { border-color: var(--accent); color: var(--text); }
    .toolbar input[type="text"]::placeholder { color: var(--text-3); }

    .toolbar select {
      height: 30px;
      padding: 0 6px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      color: var(--text-2);
      font-size: 12.5px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }
    .toolbar select:focus { border-color: var(--accent); }

    /* ============ 主区域 ============ */
    .main {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 空状态 */
    .empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 30px;
    }
    .empty .icon {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-3);
      margin-bottom: 4px;
    }
    .empty .icon svg { width: 24px; height: 24px; }
    .empty h2 { font-size: 14.5px; font-weight: 500; color: var(--text); }
    .empty p { font-size: 12.5px; color: var(--text-3); }

    /* 文件列表 */
    .file-list {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 8px 10px 4px;
    }
    .file-list::-webkit-scrollbar { width: 8px; }
    .file-list::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 4px; }
    .file-list::-webkit-scrollbar-thumb:hover { background: #3a3e46; }

    .file-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 8px;
      border-radius: var(--radius);
      border: 1px solid transparent;
    }
    .file-row:hover { background: var(--surface); border-color: var(--border); }

    .file-row .cover {
      width: 42px;
      height: 42px;
      border-radius: 5px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-3);
    }
    .file-row .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .file-row .cover svg { width: 18px; height: 18px; }

    .file-row .meta {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .file-row .title {
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-row .title.pending { color: var(--text-2); font-weight: 500; }
    .file-row .sub {
      font-size: 11.5px;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-row .sub.error { color: var(--red); }

    .chip {
      flex-shrink: 0;
      font-size: 10.5px;
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid var(--border-strong);
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
      min-width: 44px;
      text-align: center;
    }
    .chip.converting { color: var(--amber); border-color: rgba(217, 161, 59, 0.4); background: rgba(217, 161, 59, 0.08); }
    .chip.done { color: var(--green); border-color: rgba(63, 191, 127, 0.4); background: var(--green-soft); }
    .chip.error { color: var(--red); border-color: rgba(242, 85, 90, 0.4); background: var(--red-soft); }

    .bar-wrap {
      width: 110px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .bar {
      flex: 1;
      height: 3px;
      background: var(--surface-3);
      border-radius: 2px;
      overflow: hidden;
    }
    .bar .fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.25s ease;
    }
    .bar .fill.done { background: var(--green); }
    .bar .fill.error { background: var(--red); }
    .bar-pct {
      width: 32px;
      text-align: right;
      font-size: 11px;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
    }

    .row-remove {
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: var(--text-3);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      opacity: 0;
    }
    .file-row:hover .row-remove { opacity: 1; }
    .row-remove:hover { background: var(--red-soft); color: var(--red); }
    .row-remove svg { width: 12px; height: 12px; }

    /* 拖放遮罩 */
    .drop-overlay {
      position: absolute;
      inset: 8px;
      border: 2px dashed var(--accent);
      border-radius: 10px;
      background: rgba(229, 72, 77, 0.06);
      display: none;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 20;
    }
    .drop-overlay.show { display: flex; }
    .drop-overlay span {
      font-size: 14px;
      color: var(--accent);
      background: var(--surface);
      padding: 8px 18px;
      border-radius: 6px;
      border: 1px solid rgba(229, 72, 77, 0.35);
    }

    /* 批量进度条 */
    .batch {
      flex-shrink: 0;
      height: 3px;
      background: var(--surface-2);
    }
    .batch .fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    /* ============ 底栏 ============ */
    .footer {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }
    .footer .stats {
      margin-left: auto;
      font-size: 12px;
      color: var(--text-3);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .footer .stats b { color: var(--text-2); font-weight: 500; }
    .footer .stats .ok { color: var(--green); }
    .footer .stats .bad { color: var(--red); }

    /* Toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 56px;
      transform: translateX(-50%) translateY(8px);
      background: var(--surface-3);
      border: 1px solid var(--border-strong);
      color: var(--text);
      font-size: 12.5px;
      padding: 9px 16px;
      border-radius: 7px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s, transform 0.18s;
      z-index: 50;
      max-width: 70vw;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: rgba(242, 85, 90, 0.5); }

    @media (max-width: 560px) {
      .toolbar input[type="text"] { width: 110px; }
      .bar-wrap { width: 70px; }
      .chip { display: none; }
    }
  </style>
</head>
<body>

  <div class="titlebar">
    <div class="titlebar-brand">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3" fill="var(--bg)"/><circle cx="18" cy="16" r="3" fill="var(--bg)"/></svg>
      NCM 转换器
    </div>
    <div class="titlebar-controls">
      <button class="win-btn" id="btnMinimize" title="最小化">
        <svg width="10" height="10" viewBox="0 0 10 10"><line x1="0" y1="5" x2="10" y2="5" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button class="win-btn" id="btnMaximize" title="最大化">
        <svg width="10" height="10" viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button class="win-btn close" id="btnClose" title="关闭">
        <svg width="10" height="10" viewBox="0 0 10 10"><line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1.2"/><line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn" id="selectFilesBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      添加文件
    </button>
    <button class="btn" id="selectFolderBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      添加文件夹
    </button>
    <button class="btn" id="clearBtn">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
      清空
    </button>
    <div class="spacer"></div>
    <div class="field">
      <label>输出到</label>
      <input type="text" id="outputDir" placeholder="默认:与源文件同目录">
      <button class="btn" id="selectOutputBtn">浏览</button>
    </div>
    <div class="field">
      <label>并发</label>
      <select id="concurrency">
        <option value="1">1</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="8">8</option>
      </select>
    </div>
  </div>

  <div class="main">
    <div class="empty" id="empty">
      <div class="icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <h2>把 NCM 文件拖到这里</h2>
      <p>也可以点击左上角「添加文件」或「添加文件夹」,支持批量与递归扫描</p>
    </div>
    <div class="file-list" id="fileList" style="display:none"></div>
    <div class="drop-overlay" id="dropOverlay"><span>松开鼠标,添加到列表</span></div>
  </div>

  <div class="batch"><div class="fill" id="batchFill"></div></div>

  <div class="footer">
    <button class="btn btn-primary" id="startBtn" disabled>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      开始转换
    </button>
    <button class="btn" id="openOutputBtn" style="display:none">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 3h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      打开输出目录
    </button>
    <div class="stats" id="stats"></div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
